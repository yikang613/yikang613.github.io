name: Validate site

# Publishing is handled by GitHub's built-in "pages build and deployment"
# (Settings -> Pages -> Deploy from a branch: main). This workflow only checks
# the page before/after it goes live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: python scripts/validate_site.py
